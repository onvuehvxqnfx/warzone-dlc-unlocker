[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warzone-dlc-unlocker"
version = "2.4.1"
description = "Educational toolkit for Warzone DLC entitlement research"
requires-python = ">=3.10"
dependencies = [
  "tomli>=2.0.1 ; python_version < '3.11'",
  "rich>=13.7.0",
  "httpx>=0.27.0",
]

[project.scripts]
wzdlc = "warzone_dlc_unlocker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]